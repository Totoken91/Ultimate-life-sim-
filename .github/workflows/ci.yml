name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests (dont déterminisme et migrations de sauvegarde)
        run: pnpm test

      # Le vrai QA d'une simulation émergente (doc 01 §9) : si le monde produit
      # des vies absurdes, ça se voit ici avant que ça se voie en jouant.
      - name: Banc d'émergence
        run: pnpm sim 200 2
